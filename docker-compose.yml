# Local dev only: spins up Postgres + Actian VectorAI DB for the FastAPI backend.
# Deploy backend + frontend separately on Render (see README).
version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: speaksense
      POSTGRES_PASSWORD: speaksense
      POSTGRES_DB: speaksense
    ports:
      - "5432:5432"
    volumes:
      - speaksense_db_data:/var/lib/postgresql/data

  vectorai:
    image: actian/vectorai:latest
    restart: unless-stopped
    environment:
      ACTIAN_VECTORAI_ACCEPT_EULA: "YES"
    ports:
      - "6573:6573"  # REST API
      - "6574:6574"  # gRPC -- this is what the Python client actually talks to
      - "6575:6575"  # local dashboard UI
    volumes:
      - speaksense_vectorai_data:/var/lib/actian-vectorai

volumes:
  speaksense_db_data:
  speaksense_vectorai_data:
