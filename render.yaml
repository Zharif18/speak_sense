# Render Blueprint. Deploy with: connect this repo in the Render dashboard
# and choose "New > Blueprint" -- Render reads this file and provisions all
# three resources together. See README.md "Deploying to Render" for the
# full step-by-step.

databases:
  - name: speaksense-db
    plan: basic-256mb
    databaseName: speaksense
    user: speaksense

services:
  # --- FastAPI backend ---
  - type: web
    name: speaksense-backend
    runtime: python
    plan: standard
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: speaksense-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: speaksense-frontend
          property: hostport
        # Render fills this in as https://speaksense-frontend.onrender.com
        # after first deploy -- double-check it matches the CORS check in
        # app/main.py (comma-separated list, no trailing slash).
      - key: GEMINI_API_KEY
        sync: false          # set manually in the Render dashboard
      - key: WOLFRAM_APP_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: speaksense-sessions
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: ACTIAN_VECTORAI_URL
        fromService:
          type: pserv
          name: speaksense-vectorai
          property: hostport
      - key: ACTIAN_VECTORAI_COLLECTION
        value: speaksense_sessions
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2

  # --- Actian VectorAI DB (private service -- only the backend talks to it) ---
  # NOTE: Render's free plan has no persistent disk, so the vector index
  # resets on every restart/redeploy. Fine for a hackathon demo where you
  # (re)populate it live; for anything longer-lived, upgrade this service's
  # plan and attach a Render Disk mounted at /var/lib/actian-vectorai.
  - type: pserv
    name: speaksense-vectorai
    runtime: image
    plan: free
    image:
      url: docker.io/actian/vectorai:latest
    envVars:
      - key: ACTIAN_VECTORAI_ACCEPT_EULA
        value: "YES"

  # --- Next.js frontend ---
  - type: web
    name: speaksense-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: speaksense-backend
          property: hostport
          # Render fills this in as https://speaksense-backend.onrender.com
          # after first deploy; double-check it matches in the dashboard.
